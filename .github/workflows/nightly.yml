name: Agent roster nightly

on:
  schedule:
    # Weekly, Mondays after the Division's 9am ET file refresh (15:30 UTC). The license roster barely
    # changes, and each run costs RentCast API calls. Add days (e.g. "1,3,5") for more frequent pulls.
    - cron: "30 15 * * 1"
  workflow_dispatch:
    inputs:
      listings:
        description: "Also fetch RentCast listings (uses ~8 API calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-roster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Phase 1 (roster only): leave the repo variable ENABLE_LISTINGS unset. Phase 2: set it to "true"
          # (Settings > Secrets and variables > Actions > Variables). Manual runs use the checkbox instead.
          RENTCAST_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.listings || github.event_name != 'workflow_dispatch' && vars.ENABLE_LISTINGS == 'true') && secrets.RENTCAST_API_KEY || '' }}
        run: python run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data exports
          for f in data/listings_history.json data/rentcast_usage.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update agent roster $(date -u +%F)"
            git push
          fi
