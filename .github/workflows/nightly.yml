name: Agent roster nightly

on:
  schedule:
    # Mon/Wed/Fri after the Division's 9am ET file refresh (15:30 UTC). The license roster barely
    # changes, but listings do, and each run costs RentCast API calls.
    - cron: "30 15 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-roster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data exports
          if [ -f data/listings_history.json ]; then git add data/listings_history.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update agent roster $(date -u +%F)"
            git push
          fi
